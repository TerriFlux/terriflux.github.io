name: Build & deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily check for upstream mirror updates (TerriFlux/opensankey is mirrored from GitLab)
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # examples/<version>/<kind>  →  built into ./public/<version>/<kind>/
  # `current` and `html-viewer` are intentionally excluded.
  EXAMPLE_MATRIX: |
    1.0.7/viewer
    1.0.7/editor
    1.1.1/viewer
    1.1.1/editor
    1.1.3/viewer
    1.1.3/editor

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vitrine repo
        uses: actions/checkout@v4

      - name: Checkout TerriFlux/opensankey (mirror of GitLab)
        uses: actions/checkout@v4
        with:
          repository: TerriFlux/opensankey
          path: opensankey-src
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build each example
        run: |
          set -uo pipefail   # NB: pas de -e, on tolere les echecs par exemple
          mkdir -p public

          # Copy committed root index.html and assets
          cp index.html public/
          [ -f favicon.ico ] && cp favicon.ico public/ || true

          built=()
          failed=()

          while IFS= read -r ex; do
            [ -z "$ex" ] && continue
            src_dir="opensankey-src/examples/$ex"
            dest_dir="public/$ex"
            echo "::group::Building $ex"

            if [ ! -d "$src_dir" ]; then
              echo "$src_dir not found, skipping"
              failed+=("$ex (source not found)")
              echo "::endgroup::"
              continue
            fi

            (
              set -e
              cd "$src_dir"
              # Build path relatif (la vitrine sert chaque demo sous /<v>/<kind>/)
              export PUBLIC_URL="."
              # GitHub Actions defines CI=true automatiquement, ce qui fait
              # traiter les warnings ESLint comme des erreurs par react-scripts.
              # On veut juste les builds, pas la stricte qualite => CI=false.
              export CI=false
              # CI use Node 20 + npm 10 strict ; les deps de react-scripts 5
              # entrent en conflit avec TS 5.x => --legacy-peer-deps
              npm install --no-audit --no-fund --prefer-offline --legacy-peer-deps
              npm run build
            )

            if [ $? -eq 0 ] && [ -d "$src_dir/build" ]; then
              mkdir -p "$dest_dir"
              cp -r "$src_dir/build/"* "$dest_dir/"
              echo "OK: $ex built"
              built+=("$ex")
            else
              echo "FAILED: $ex"
              failed+=("$ex")
            fi
            echo "::endgroup::"
          done <<< "$EXAMPLE_MATRIX"

          echo ""
          echo "================================================="
          echo "Summary"
          echo "  Built  (${#built[@]}): ${built[*]:-(none)}"
          echo "  Failed (${#failed[@]}): ${failed[*]:-(none)}"

          # On considere le job OK tant qu'au moins un exemple s'est build.
          # Comme ca on deploie quand meme une vitrine partielle.
          if [ ${#built[@]} -eq 0 ]; then
            echo "::error::No example built successfully, aborting."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
